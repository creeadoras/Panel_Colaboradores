<script type="text/babel">

const {

function App(){

const [installPrompt,setInstallPrompt] =

const [busquedaMaterial,setBusquedaMaterial] =

const [modalProveedor,setModalProveedor] =
useState(false);

const [proveedorEditando,setProveedorEditando] =
useState(null);

const [imagenAmpliada,setImagenAmpliada] =
useState(null);

const [materialAfectadoAbierto,setMaterialAfectadoAbierto] =
useState(null);

const [busquedaPresupuesto,setBusquedaPresupuesto] =
useState("");

const [controlModal,setControlModal] =
useState(null);

const [calendarMonth,setCalendarMonth] =
useState(()=>{
  const hoy = new Date();
  return new Date(hoy.getFullYear(),hoy.getMonth(),1);
});

const [focusedPresupuestoId,setFocusedPresupuestoId] =
useState(null);

const [materialExtra,setMaterialExtra] =

const [cantidadExtra,setCantidadExtra] =
useState({});

useState("");

useState([]);

const [presupuestos,setPresupuestos] =
useState([]);

const [empresas,setEmpresas] =
useState([]);

const [loading,setLoading] =
useState(true);

const [materialEditando,setMaterialEditando] =
useState(null);

const [materialForm,setMaterialForm] =
useState({
  nombre:"",
  stock:"",
  imagen:""
});

useState(false);

useEffect(()=>{
  cargarTodo();
},[]);

useEffect(()=>{
  const splash = document.getElementById("webSplash");
  if(!splash){
    return;
  }

  const timer = setTimeout(()=>{
    splash.classList.add("splash-hide");
    setTimeout(()=>{
      splash.remove();
    },500);
  },900);

  return ()=>clearTimeout(timer);
},[]);

useEffect(()=>{
  const handler = e=>{
    e.preventDefault();
    setInstallPrompt(e);
  };

  window.addEventListener(
    "beforeinstallprompt",
    handler
  );

  return ()=>{
    window.removeEventListener(
      "beforeinstallprompt",
      handler
    );
  };
},[]);

async function instalarApp(){
  if(!installPrompt){
    return;
  }

  installPrompt.prompt();
  await installPrompt.userChoice;
}

function nuevaEmpresa(){
  setProveedorEditando({
    nombre:"",
    telefono:"",
    servicio:"",
    precio:0
  });

  setModalProveedor(true);
}

function editarEmpresa(empresa){
  setProveedorEditando({
    ...empresa
  });

  setModalProveedor(true);
}

async function guardarProveedor(){
  const payload = {
    nombre:proveedorEditando.nombre || "",
    telefono:proveedorEditando.telefono || "",
    servicio:proveedorEditando.servicio || "",
    precio:Number(proveedorEditando.precio || 0)
  };

  let res;

  if(proveedorEditando.id){
    res = await db
    .from("proveedores")
    .update(payload)
    .eq("id",proveedorEditando.id);
  }else{
    res = await db
    .from("proveedores")
    .insert(payload);
  }

  if(res.error){
    alert("No se pudo guardar la empresa.");
    console.error(res.error.message);
    return;
  }

  setModalProveedor(false);
  setProveedorEditando(null);
  cargarTodo();
}

function abrirNuevoMaterial(){
  setMaterialEditando({
    id:null,
    nombre:"",
    stock:"",
    imagen:""
  });

  setMaterialForm({
    nombre:"",
    stock:"",
    imagen:""
  });

  setImagenMaterialFile(null);
  setImagenMaterialPreview("");
}

async function eliminarMaterial(material){
  const confirmado =
  window.confirm(
    `¿Eliminar el material "${material.nombre}"?`
  );

  if(!confirmado){
    return;
  }

  const {
    error
  } = await db
  .from("materiales")
  .delete()
  .eq("id",material.id);

  if(error){
    console.error(
      "Error eliminando material:",
      error.message
    );

    alert("No se pudo eliminar el material.");
    return;
  }

  setMateriales(prev=>
    prev.filter(m=>
      m.id !== material.id
    )
  );
}

function materialAfectadoEnPresupuestos(material){
  return presupuestos
  .map(p=>{
    const items =
    (p.checklist || [])
    .filter(item=>{
      const itemMaterialId =
      item.material_id ||
      item.id_material ||
      item.materialId ||
      item.id;

      const coincidePorid =
      String(itemMaterialId) === String(material.id);

      const coincidePorNombre =
      normalizarTexto(item.label)
      .includes(
        normalizarTexto(material.nombre)
      );

      return coincidePorid || coincidePorNombre;
    });

    if(items.length === 0){
      return null;
    }

    return {
      presupuesto:p,
      items
    };
  })
  .filter(Boolean);
}

function cantidadDesdeLabel(label){
  const match =
  String(label || "").match(/^(\d+)x\s/i);

  return match
  ? Number(match[1])
  : 1;
}

function cantidadMaterialEnItem(item){
  return Number(
    item.cantidad ||
    item.enviado ||
    cantidadDesdeLabel(item.label)
  );
}

async function cargarTodo(){
  setLoading(true);

  const {
    data:mat
  } = await db
  .from("materiales")
  .select("*")
  .order("id",{ascending:false});

  const {
    data:pres
  } = await db
  .from("presupuestos")
  .select("*")
  .order("fecha",{ascending:true})
  .order("id",{ascending:true});

  const {
    data:emp
  } = await db
  .from("proveedores")
  .select("*");

  setMateriales(mat || []);
  setPresupuestos(
    ordenarPresupuestos(pres || [])
  );
  setEmpresas(emp || []);

  setLoading(false);
}

function materialesFiltradores(){
  const busqueda =
  normalizarTexto(busquedaMaterial.trim());

  if(!busqueda){
    return [];
  }

  return materiales.filter(m=>
    normalizarTexto(m.nombre).includes(busqueda) ||
    normalizarTexto(m.stock).includes(busqueda)
  );
}

function presupuestosFiltradores(){
  const busqueda =
  normalizarTexto(busquedaPresupuesto);

  const visibles =
  presupuestos.filter(p=>p.archivado !== true);

  if(!busqueda){
    return visibles;
  }

  return visibles.filter(p=>
    normalizarTexto(p.cliente).includes(busqueda) ||
    normalizarTexto(p.estado).includes(busqueda) ||
    normalizarTexto(p.fecha).includes(busqueda)
  );
}

function mesPresupuesto(fecha){
  if(!fecha){
    return "Sin fecha";
  }

  const date =
  new Date(fecha + "T00:00:00");

  return date.toLocaleDateString(
    "es-AR",
    {
      month:"long",
      year:"numeric"
    }
  );
}

function presupuestosAgrupados(){
  return presupuestosFiltradores()
  .reduce((grupos,p)=>{
    const mes =
    mesPresupuesto(p.fecha);

    if(!grupos[mes]){
      grupos[mes] = [];
    }

    grupos[mes].push(p);

    return grupos;
  },{});
}

function cantidadItem(item){
  if(item.cantidad){
    return Number(item.cantidad);
  }

  const match =
  String(item.label || "").match(/^(\d+)x\s/i);

  return match ? Number(match[1]) : 1;
}

function materialIdItem(item){
  if(item.material_id){
    return item.material_id;
  }

  if(item.id && !String(item.id).startsWith("extra-")){
    return item.id;
  }

  return "";
}

function controlEtapaConfig(tipo){
  const configs = {
    carga:{
      titulo:"Control de carga en camion",
      campo:"cargado",
      label:"Cargado en el camion",
      completo:"cargado completo en el camion",
      incompleto:"carga incompleta - faltan materiales",
      nota:"Marcá todo lo que efectivamente se carga en el camion antes de salir."
    },
    llegada_evento:{
      titulo:"Control de llegada al evento",
      campo:"llegada_evento_ok",
      label:"Llego al evento",
      completo:"llegada al evento completa",
      incompleto:"llegada al evento con faltantes",
      nota:"Controlá que todo lo cargado haya llegado al evento."
    },
    salida_evento:{
      titulo:"Control de carga al terminar el evento",
      campo:"salida_evento_ok",
      label:"Vuelve en camion",
      completo:"salida del evento completa",
      incompleto:"salida con materiales en otro vehiculo",
      nota:"Si algo no vuelve en el camion, dejá asentado el vehículo y destino."
    },
    descarga_deposito:{
      titulo:"Control de descarga en deposito",
      campo:"descarga_deposito_ok",
      label:"Descargado en deposito",
      completo:"devuelto_correcto",
      incompleto:"deposito con faltantes",
      nota:"Control final de descarga, incluyendo camion y otros vehiculos."
    }
  };

  return configs[tipo] || configs.carga;
}

function itemsFaltantesControl(checklist,tipo){
  const config = controlEtapaConfig(tipo);

  return (checklist || []).filter(item=>
    !item[config.campo]
  );
}

function nombreItemControl(item){
  return item.label || item.nombre || "Material sin nombre";
}

function tipoFaltantePorEstado(estado){
  const texto = normalizarTexto(estado);

  if(texto.includes("carga incompleta")){
    return "carga";
  }

  if(texto.includes("llegada") && texto.includes("faltantes")){
    return "llegada_evento";
  }

  if(texto.includes("salida") && texto.includes("otro vehiculo")){
    return "salida_evento";
  }

  if(texto.includes("deposito") && texto.includes("faltantes")){
    return "descarga_deposito";
  }

  return "";
}

function abrirControl(presupuesto,tipo){
  setControlModal({
    tipo,
    presupuesto:JSON.parse(JSON.stringify(presupuesto))
  });
}

function cerrarControl(){
  setControlModal(null);
}

function actualizarItemControl(idx,cambios){
  setControlModal(prev=>{
    if(!prev){
      return prev;
    }

    const checklist =
    (prev.presupuesto.checklist || [])
    .map((item,index)=>
      index === idx
      ? {
          ...item,
          ...cambios
        }
      : item
    );

    return {
      ...prev,
      presupuesto:{
        ...prev.presupuesto,
        checklist
      }
    };
  });
}

function agregarItemControl(){
  setControlModal(prev=>{
    if(!prev){
      return prev;
    }

    const checklist = [
      ...(prev.presupuesto.checklist || []),
      {
        id:`extra-${Date.now()}`,
        label:materialExtra[prev.tipo] || "",
        cantidad:cantidadExtra[prev.tipo] || 1
      }
    ];

    return {
      ...prev,
      presupuesto:{
        ...prev.presupuesto,
        checklist
      }
    };
  });

  setMaterialExtra(prev=>({
    ...prev,
    [controlModal.tipo]:""
  }));

  setCantidadExtra(prev=>({
    ...prev,
    [controlModal.tipo]:1
  }));
}

function normalizarTexto(texto){
  return String(texto || "")
  .toLowerCase()
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"");
}

async function guardarControl(){
  if(!controlModal || !controlModal.presupuesto){
    return;
  }

  const payload = {
    checklist:controlModal.presupuesto.checklist
  };

  const {error} = await db
  .from("presupuestos")
  .update(payload)
  .eq("id",controlModal.presupuesto.id);

  if(error){
    console.error("Error guardando control:",error);
    alert("No se pudo guardar el control");
    return;
  }

  setControlModal(null);
  cargarTodo();
}

function ordenarPresupuestos(presupuestos){
  return presupuestos.sort((a,b)=>{
    if(a.archivado && !b.archivado) return 1;
    if(!a.archivado && b.archivado) return -1;
    return 0;
  });
}

  return (
    React.createElement('div', {className:'app'},
      React.createElement('div', {className:'sidebar'},
        React.createElement('div', {className:'brand'},
          React.createElement('img', {src:LOGO, alt:'Logo'}),
          'Cree Adoras'
        ),
        React.createElement('button', {
          className:section === 'dashboard' ? 'active' : '',
          onClick:()=>setSection('dashboard')
        }, 'Panel'),
        React.createElement('button', {
          className:section === 'materiales' ? 'active' : '',
          onClick:()=>setSection('materiales')
        }, 'Materiales'),
        React.createElement('button', {
          className:section === 'presupuestos' ? 'active' : '',
          onClick:()=>setSection('presupuestos')
        }, 'Presupuestos'),
        React.createElement('button', {
          className:section === 'empresas' ? 'active' : '',
          onClick:()=>setSection('empresas')
        }, 'Empresas')
      ),
      React.createElement('div', {className:'content'},
        section === 'dashboard' && React.createElement('div', null,
          React.createElement('h1', {className:'page-title'}, 'Panel de Control'),
          loading ? React.createElement('p', null, 'Cargando...') : React.createElement('div', null, 'Dashboard')
        ),
        section === 'materiales' && React.createElement('div', null,
          React.createElement('h1', {className:'page-title'}, 'Materiales'),
          React.createElement('button', {className:'btn', onClick:abrirNuevoMaterial}, 'Nuevo Material'),
          React.createElement('div', {className:'search-bar'},
            React.createElement('input', {
              type:'text',
              placeholder:'Buscar materiales...',
              value:busquedaMaterial,
              onChange:e=>setBusquedaMaterial(e.target.value)
            })
          ),
          loading ? React.createElement('p', null, 'Cargando...') : React.createElement('div', null, 'Listado de materiales')
        ),
        section === 'presupuestos' && React.createElement('div', null,
          React.createElement('h1', {className:'page-title'}, 'Presupuestos'),
          React.createElement('div', {className:'search-bar'},
            React.createElement('input', {
              type:'text',
              placeholder:'Buscar presupuestos...',
              value:busquedaPresupuesto,
              onChange:e=>setBusquedaPresupuesto(e.target.value)
            })
          ),
          loading ? React.createElement('p', null, 'Cargando...') : React.createElement('div', null, 'Listado de presupuestos')
        ),
        section === 'empresas' && React.createElement('div', null,
          React.createElement('h1', {className:'page-title'}, 'Empresas'),
          React.createElement('button', {className:'btn', onClick:nuevaEmpresa}, 'Nueva Empresa'),
          loading ? React.createElement('p', null, 'Cargando...') : React.createElement('div', null, 'Listado de empresas')
        )
      )
    )
  );
}

const rootEl = document.getElementById('root');
if(rootEl && ReactDOM && ReactDOM.createRoot){
  ReactDOM.createRoot(rootEl).render(React.createElement(App));
}else if(rootEl && ReactDOM && ReactDOM.render){
